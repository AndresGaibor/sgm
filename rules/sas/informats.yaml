id: informats
kind: informats
version: 1
status: soportado
description: "Tipo que fija un informat o formato de SAS. Lo lee src/sgm/ir/types_code.py (R7)."
entries:
  # Informats de fecha u hora: `yymmdd8.`, `ddmmyy10.`, `datetime20.`. Tipo Date.
  # Los nombres salen del diccionario de `leforinforref.pdf` (p. 553): DTDATE y DTMONYY son
  # formats, no informats, y por eso no están en la lista.
  - id: fecha
    names: [yymmdd, ddmmyy, mmddyy, date, datetime, time, monyy, yyq, julian]
    type: Date
  # `$w.` o `charw.`: texto de longitud w. Tipo String.
  - id: caracter
    marker: "$"
    prefix: char
    type: String
  # Numérico `w.d`: con decimales, BigDecimal; sin ellos, Long si w <= long_max_width, Double si no.
  - id: numerico
    decimals_type: BigDecimal
    long_max_width: 18
    long_type: Long
    wide_type: Double
tests:
  - tests/cases/informats-basicos
