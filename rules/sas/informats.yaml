id: informats
kind: informats
version: 2
status: soportado
description: "Tipo que fija un informat o formato de SAS. Lo lee src/sgm/ir/types_code.py (R7)."
entries:
  # Informats de fecha u hora. ANYDTDTE fija el tipo, pero su conversión depende de opciones SAS.
  # Los nombres salen del diccionario de `leforinforref.pdf` (p. 553): DTDATE y DTMONYY son
  # formats, no informats, y por eso no están en la lista.
  - id: fecha
    names: [yymmdd, ddmmyy, mmddyy, date, datetime, time, monyy, yyq, julian, anydtdte, e8601da]
    type: Date
  # `$w.` o `charw.`: texto de longitud w. Tipo String.
  - id: caracter
    marker: "$"
    prefix: char
    type: String
  # El ancho de campo no demuestra que el dato sea entero. Los numéricos sin d son Double.
  - id: numerico
    names: [best, comma, dollar]
    decimals_type: BigDecimal
    no_decimals_type: Double
tests:
  - tests/cases/informats-basicos
