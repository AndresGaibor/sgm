id: procs-usados
kind: catalogo
version: 1
description: Procedimientos que aparecen en client_large.sas, con su página. 'reconocida' = el repo lo lee; el resto
  no tiene tratamiento propio. Los conteos son sentencias PROC del programa grande.
entries:
- id: sql
  nombre: PROC SQL
  fuente: sqlproc.pdf, p. 269
  estado: reconocida
  nota: '521 usos; reglas en rules/sas/catalogo/sentencias-proc-sql.yaml y parser propio'
- id: delete
  nombre: PROC DELETE
  fuente: proc.pdf, p. 837
  estado: reconocida
  nota: '216 usos; solo se omite con aviso cuando DATA= demuestra miembros de WORK (proc.pdf, pp. 839, 847); bibliotecas permanentes o referencias dinámicas quedan pendientes como P-DELETE-PERSISTENTE.'
- id: sort
  nombre: PROC SORT
  fuente: proc.pdf, p. 2460
  estado: reconocida
  nota: "31 usos; BY, NODUPKEY, DUPOUT= y NOEQUALS; DESCENDING (proc.pdf, p. 2479). NODUPREC solo se traduce con BY _ALL_ por adyacencia (lrcon.pdf, p. 714). NODUPKEY queda parcial hasta validar la estabilidad de tSortRow; las demás opciones no declaradas siguen pendientes"
- id: contents
  nombre: PROC CONTENTS
  fuente: proc.pdf, p. 541
  estado: reconocida
  nota: '30 usos; DATA=WORK.<miembro> sin OUT= y con reports=discard omite la salida diagnóstica con aviso; con reports=log/csv sigue pendiente. WORK._ALL_ OUT= queda como P-WORK-INTROSPECCION (p. 547) y las salidas OUT= de una tabla concreta siguen pendientes.'
- id: upload
  nombre: PROC UPLOAD
  fuente: connref.pdf, p. 247
  estado: reconocida
  nota: '22 usos; archivos literales se resuelven como alias de ruta (ir/pase_copias_remotas.py); la copia no se materializa; DATA=/OUT=, bibliotecas y catálogos quedan pendientes'
- id: export
  nombre: PROC EXPORT
  fuente: proc.pdf, p. 904; acpcref.pdf, p. 93; proc.pdf, p. 910
  estado: reconocida
  nota: '22 usos; CSV respeta DELIMITER y PUTNAMES (proc, p. 904 y 910); la sección XLS/XLSX documenta SHEET= para exportación (acpcref, inicia p. 93; detalle pp. 97–98), pero la fila de encabezado no tiene equivalencia documentada y queda pendiente antes de emitir.'
- id: import
  nombre: PROC IMPORT
  fuente: proc.pdf, p. 1380; proc.pdf, p. 1385; proc.pdf, p. 1387; proc.pdf, p. 1388; proc.pdf, p. 1394; acpcref.pdf, p. 93
  estado: reconocida
  nota: '10 usos; CSV y DLM respetan GETNAMES, DATAROW y GUESSINGROWS con tipos derivados de la muestra; DATAFILE=fileref se resuelve por FILENAME (proc, p. 1394); XLSX con SHEET= y GETNAMES=; DATAROW en XLSX sigue pendiente de validar con plantilla; XLS se emite como Excel pero no se ejecuta en el intérprete (P-XLS-SIN-EJECUCION); columnas Excel sin tipo probado dejan P-TIPO-EXCEL.'
- id: download
  nombre: PROC DOWNLOAD
  fuente: connref.pdf, p. 287
  estado: reconocida
  nota: '4 usos; archivos literales se resuelven como alias de ruta (ir/pase_copias_remotas.py); la copia no se materializa; DATA=/OUT=, bibliotecas y catálogos quedan pendientes'
- id: pwencode
  nombre: PROC PWENCODE
  fuente: proc.pdf, p. 1997
  estado: no_verificada
  nota: '1 uso; cifra una contraseña en el propio programa. Es un secreto, no una transformación'
