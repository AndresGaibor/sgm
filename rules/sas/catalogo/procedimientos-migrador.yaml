id: procedimientos-migrador
kind: catalogo
version: 1
description: Procedimientos con tratamiento general documentado en el migrador.
entries:
  - id: format
    nombre: PROC FORMAT VALUE
    fuente: proc.pdf, p. 1173
    estado: reconocida
    nota: 'Solo VALUE discreto de carácter y OTHER (pp. 1178, 1181); registro inmutable en Plan.formatos y aplicación B de PUT (lefunctionsref.pdf, pp. 1417–1418; leforinforref.pdf, p. 22). Rangos numéricos: P-FORMATO-RANGO-SIN-SOPORTE; otras formas: P-FORMATO-SIN-SOPORTE. La emisión Talend conserva P-FORMATO-USUARIO-SIN-EMISOR; no implementa el alcance general de D1-20.'
  - id: freq
    nombre: PROC FREQ
    fuente: proc.pdf, p. 89
    estado: no_verificada
    nota: 'La página solo documenta MISSPRINT: muestra niveles faltantes sin usarlos en los estadísticos; no demuestra OUT= ni COUNT/PERCENT. Sin OUT= se aplica reports; TABLES OUT= conserva P-FREQ-OUT-SIN-PAGINA. No es un uso del programa cliente.'
  - id: means
    nombre: PROC MEANS
    fuente: proc.pdf, p. 1521
    estado: reconocida
    nota: 'CLASS/VAR/OUTPUT con SUM, MEAN, MIN, MAX, N y NMISS (pp. 1555–1558); faltantes por variable (p. 1571). CLASS exige NWAY y DROP=_TYPE_ _FREQ_ (pp. 1536, 1572–1573). Sin CLASS produce una fila global. STD y opciones no modeladas quedan pendientes; sin OUTPUT conserva la forma declarativa. NMISS se ejecuta en el intérprete; su emisión Talend queda pendiente sin equivalencia de componente demostrada.'
  - id: summary
    nombre: PROC SUMMARY
    fuente: proc.pdf, p. 2549
    estado: reconocida
    nota: 'Comparte el lowering explícito y los límites de MEANS conforme a la remisión de p. 2549; agregado global sin CLASS con nombres explícitos y DROP de las columnas automáticas.'
  - id: datasets
    nombre: PROC DATASETS
    fuente: proc.pdf, p. 613
    estado: reconocida
    nota: 'DELETE o KILL solo se omite con LIBRARY=WORK explícito (pp. 616, 627); biblioteca no literal o ausente: P-DELETE-BIBLIOTECA-SIN-DEMOSTRAR; otra biblioteca literal: P-DELETE-PERSISTENTE.'
  - id: copy
    nombre: PROC COPY
    fuente: proc.pdf, p. 573
    estado: reconocida
    nota: 'SELECT estático con OUT=WORK distinto de IN= produce lectura y escritura por miembro (pp. 573–575); sin SELECT: P-COPY-SIN-LISTA; destino persistente: P-COPY-PERSISTENTE; mismas bibliotecas: P-COPY-MISMA-BIBLIOTECA.'
  - id: append
    nombre: PROC APPEND
    fuente: proc.pdf, p. 161
    estado: reconocida
    nota: 'BASE y DATA estáticos y distintos escriben sobre BASE; las bases nuevas de WORK se crean desde DATA (p. 639). FORCE se requiere cuando DATA añade variables, cambia el tipo o trae una longitud mayor; esas discrepancias y bases permanentes sin fuente quedan pendientes (p. 640).'
