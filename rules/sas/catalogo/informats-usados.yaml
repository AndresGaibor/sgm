id: informats-usados
kind: catalogo
version: 1
description: Informats de SAS 9.4 que el traductor tipa o que aparecen en el corpus, con su página. 'reconocida' =
  `rules/sas/informats.yaml` le da un tipo; 'no_verificada' = existe en la guía y el repo no la tipa.
entries:
