id: funciones-guia
kind: catalogo
version: 1
description: Funciones de la guía de SAS que este repo implementa o planea, con su página; las del programa grande están en funciones-usadas.yaml.
entries:
  - id: length-function
    nombre: LENGTH Function
    fuente: lefunctionsref.pdf, p. 1180
    estado: reconocida
    nota: 'excluye blancos finales y conserva longitud 1 para blanco; LENGTH mide bytes y fuera de ASCII queda pendiente hasta conocer la codificación SAS'
  - id: propcase-function
    nombre: PROPCASE Function
    fuente: lefunctionsref.pdf, p. 1395
    estado: no_verificada
    nota: 'ASCII: oráculo e intérprete; Java pendiente P-JAVA-PROPCASE; otros caracteres requieren TRANTAB, ENCODING y LOCALE conocidos'
  - id: repeat-function
    nombre: REPEAT Function
    fuente: lefunctionsref.pdf, p. 1478
    estado: reconocida
    nota: 'oráculo e intérprete admiten enteros no negativos; Java traduce literales enteros no negativos; otros conteos quedan P-REPEAT-N-ENTERO'
  - id: reverse-function
    nombre: REVERSE Function
    fuente: lefunctionsref.pdf, p. 1480
    estado: reconocida
    nota: 'Java e intérprete disponibles para SBCS; L4 omite blancos finales por longitud declarada; codificación del campo aún no se configura'
  - id: right-function
    nombre: RIGHT Function
    fuente: lefunctionsref.pdf, p. 1483
    estado: reconocida
    nota: 'oráculo, intérprete y Java; pendiente L4 por longitud declarada del campo'
  - id: trimn-function
    nombre: TRIMN Function
    fuente: lefunctionsref.pdf, p. 1627
    estado: no_verificada
    nota: 'oráculo e intérprete implementados; Java pendiente'
  - id: compbl-function
    nombre: COMPBL Function
    fuente: lefunctionsref.pdf, p. 572
    estado: reconocida
    nota: 'oráculo, intérprete y Java comprimen secuencias de espacios; tabuladores y otros blancos quedan fuera del alcance demostrado'
  - id: count-function
    nombre: COUNT Function
    fuente: lefunctionsref.pdf, p. 608
    estado: reconocida
    nota: 'oráculo e intérprete admiten I y T; Java usa COUNT de Talend con esos modificadores; modificadores dinámicos y otros quedan pendientes'
  - id: find-function
    nombre: FIND Function
    fuente: lefunctionsref.pdf, p. 807
    estado: reconocida
    nota: 'oráculo e intérprete admiten I y T e inicios enteros; Java admite I/T literales e inicios enteros constantes; K y datos fuera de SBCS quedan pendientes'
  - id: index-function
    nombre: INDEX Function
    fuente: lefunctionsref.pdf, p. 1071
    estado: reconocida
    nota: 'búsqueda de dos argumentos, sensible a mayúsculas, base uno y cero si no encuentra; fuera de SBCS queda pendiente'
  - id: lengthc-function
    nombre: LENGTHC Function
    fuente: lefunctionsref.pdf, p. 1181
    estado: reconocida
    nota: 'cuenta caracteres e incluye blancos finales; Java e intérprete cuentan puntos de código Unicode; longitud de campo faltante depende del esquema'
  - id: lengthn-function
    nombre: LENGTHN Function
    fuente: lefunctionsref.pdf, p. 1185
    estado: reconocida
    nota: 'cuenta hasta el último carácter no blanco; blanco da cero; Java conserva cero ante null'
  - id: tranwrd-function
    nombre: TRANWRD Function
    fuente: lefunctionsref.pdf, p. 1619
    estado: reconocida
    nota: 'reemplaza apariciones no solapadas; reemplazo vacío produce un blanco; Java requiere objetivo literal no vacío para demostrar la condición SAS'
  - id: translate-function
    nombre: TRANSLATE Function
    fuente: lefunctionsref.pdf, p. 1613
    estado: reconocida
    nota: 'oráculo e intérprete aplican sustitución simultánea; Java requiere listas literales SBCS sin solapamiento entre origen y destino'
  - id: substr-left-of-function
    nombre: SUBSTR (left of =) Function
    fuente: lefunctionsref.pdf, p. 1572
    estado: reconocida
    nota: 'el emisor reescribe pseudovariables con variable simple y expresiones posicionales; preserva el ancho mediante SUBSTRN/REPEAT; codificación fuera de SBCS y formas no interpretables quedan pendientes'
  - id: int-function
    nombre: INT Function
    fuente: lefunctionsref.pdf, p. 1087
    estado: reconocida
    nota: 'intérprete, oráculo y Java truncan hacia cero y aplican el fuzz documentado de 1E-12; valores no finitos quedan como faltante'
  - id: ceil-function
    nombre: CEIL Function
    fuente: lefunctionsref.pdf, p. 545
    estado: reconocida
    nota: 'intérprete, oráculo y Java devuelven el entero superior con el fuzz documentado de 1E-12; dominios no finitos quedan como faltante'
  - id: floor-function
    nombre: FLOOR Function
    fuente: lefunctionsref.pdf, p. 841
    estado: reconocida
    nota: 'intérprete, oráculo y Java devuelven el entero inferior con el fuzz documentado de 1E-12; dominios no finitos quedan como faltante'
  - id: mod-function
    nombre: MOD Function
    fuente: lefunctionsref.pdf, p. 1240; lepg.pdf, p. 124
    estado: reconocida
    nota: 'signo del resultado igual al dividendo; Java usa % y conserva decimales; divisor cero produce faltante por inferencia de la regla general de operación inválida; fuzz cerca de múltiplos y precisión menor a tres dígitos quedan P-MOD-FUZZ'
  - id: abs-function
    nombre: ABS Function
    fuente: lefunctionsref.pdf, p. 230
    estado: reconocida
    nota: 'intérprete, oráculo y Java devuelven el valor absoluto y propagan faltantes'
  - id: sqrt-function
    nombre: SQRT Function
    fuente: lefunctionsref.pdf, p. 1555; lepg.pdf, p. 124
    estado: reconocida
    nota: 'intérprete, oráculo y Java calculan raíz para argumentos no negativos; dominio negativo produce faltante por inferencia de la regla general de operación inválida; la nota de log SAS queda pendiente'
  - id: log-function
    nombre: LOG Function
    fuente: lefunctionsref.pdf, p. 1206; lepg.pdf, p. 124
    estado: reconocida
    nota: 'intérprete, oráculo y Java calculan logaritmo natural para argumentos positivos; LOG(0) produce faltante por regla general documentada y negativos por inferencia del dominio; la nota de log SAS queda pendiente'
  - id: exp-function
    nombre: EXP Function
    fuente: lefunctionsref.pdf, p. 712; lepg.pdf, p. 124
    estado: reconocida
    nota: 'intérprete, oráculo y Java calculan e elevado al argumento; overflow se representa como faltante por la regla general de operación inválida; la nota de log SAS queda pendiente'
  - id: sign-function
    nombre: SIGN Function
    fuente: lefunctionsref.pdf, p. 1528
    estado: reconocida
    nota: 'intérprete, oráculo y Java devuelven -1, 0 o 1 según el signo; faltantes se propagan'
  - id: round-function
    nombre: ROUND Function
    fuente: lefunctionsref.pdf, p. 1486
    estado: reconocida
    nota: 'oráculo, intérprete y Java usan aritmética decimal y empates alejándose de cero; Java usa BigDecimal/HALF_UP y la unidad de L4 es literal'
