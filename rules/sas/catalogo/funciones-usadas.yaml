id: funciones-usadas
kind: catalogo
version: 1
description: Funciones y CALL routines de SAS que aparecen en client_large.sas, con la página de la guía oficial. estado 'reconocida'
  = el traductor ya la convierte (regla en rules/sas/functions o rutina en src/sgm/expressions/talend_tabla.py);
  'no_verificada' = el repo no la traduce todavía.
