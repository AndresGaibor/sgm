# Reglas semánticas de PROC SQL. Las lee `src/sgm/ir/sql_semantics.py`, y de ahí las usan el
# lowering de PROC SQL (`ir/lower_sql_flow.py`) y el generador de SQL de base (`passes/db_sql.py`).
#
# Cada regla tiene un id, que el código conoce, y un tratamiento:
#   pendiente          la sentencia queda parcial con su motivo; no se genera SQL para ella.
#   programa_anfitrion el valor se asigna en el programa anfitrión (operador set_variable), no en SQL.
#
# Un tratamiento distinto de los dos de arriba, o un id que el código no conoce, hace fallar la carga.
version: 1
reglas:
  - id: agregado-sin-group-by
    descripcion: >-
      SELECT con función de agregado y columnas que no se agregan, sin GROUP BY. SAS remezcla esas
      columnas en cada fila; el SQL estándar y Impala lo rechazan. No hay equivalencia demostrada.
    tratamiento: pendiente
    etiqueta: AGREGADO_SIN_GROUP_BY
  - id: select-into-macrovariable
    descripcion: >-
      SELECT ... INTO :variable. El valor de la macro variable es parte del programa anfitrión:
      la consulta se traduce como flujo y la asignación como un operador set_variable.
    tratamiento: programa_anfitrion
    etiqueta: SELECT_INTO
