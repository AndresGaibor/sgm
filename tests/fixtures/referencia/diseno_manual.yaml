# Referencia legible por máquina de docs/diseno-talend-exogena-depositos.md (Fase 0).
#
# Fidelidad: cada fila copia el texto del documento (sin el formato de comillas invertidas).
# No se corrige ni se completa nada; lo que el documento marca "pendiente" queda como "pendiente".
#
# Esquema de una fila:
#   id             identificador estable de la fila (no cambia si el documento se reordena).
#   clave          clave natural de la fila dentro de su sección (única en la sección).
#   clasificacion  derivable | declarada | humana
#                    derivable: el emisor lo produce solo, desde la estructura del SAS o por una
#                               convención fija del emisor; no hace falta YAML ni una persona.
#                    declarada: hace falta un valor o una elección en el YAML de decisiones.
#                    humana:    decisión o riesgo que solo una persona confirma.
#   motivo         por qué se clasificó así (corto).
#   campos         el resto de columnas de la tabla, con los nombres de columna del documento.
#
# Sección con `md: false`: son notas sueltas del documento, no una tabla; la prueba de conteo
# contra el Markdown no las cuenta.

version: 1
documento: docs/diseno-talend-exogena-depositos.md

secciones:

  "1.1":
    titulo: Fuentes externas
    columnas: [tipo, ubicacion, uso, estado]
    filas:
      - {id: F01, clave: 'Homologación de tipo de documento', clasificacion: derivable, motivo: 'El SAS lee el archivo con ruta y nombre explícitos', campos: {tipo: 'Excel', ubicacion: 'ruta_insumos + arch_hom_tpo_doc', uso: 'Lookup de tipo de documento (CTE/AHO)', estado: 'Ruta confirmada en SAS'}}
      - {id: F02, clave: 'Homologación de tipo de documento Nequi', clasificacion: derivable, motivo: 'El SAS lee el archivo con ruta y nombre explícitos', campos: {tipo: 'Excel', ubicacion: 'ruta_insumos + arch_hom_tpo_doc_nequi', uso: 'Lookup de tipo de documento (NEQUI)', estado: 'Ruta confirmada en SAS'}}
      - {id: F03, clave: 'Códigos de país', clasificacion: derivable, motivo: 'El SAS lee el archivo con ruta y nombre explícitos', campos: {tipo: 'Excel', ubicacion: 'ruta_insumos + arch_paises', uso: 'Lookup de país', estado: 'Ruta confirmada en SAS'}}
      - {id: F04, clave: 'Códigos DANE', clasificacion: declarada, motivo: 'El nombre del archivo no está en el SAS; se declara en el YAML', campos: {tipo: 'Excel', ubicacion: 'ruta_insumos + arch_dane', uso: 'Lookup de departamento y municipio', estado: 'pendiente (nombre de archivo)'}}
      - {id: F05, clave: 'Validación de fecha', clasificacion: derivable, motivo: 'El SAS lee el archivo con ruta y nombre explícitos', campos: {tipo: 'Excel', ubicacion: 'ruta_insumos + arch_validacion_fecha', uso: 'Periodo (AÑO, MES, DIA)', estado: 'Ruta confirmada en SAS'}}
      - {id: F06, clave: 'Depósitos corriente (origen CTE)', clasificacion: declarada, motivo: 'El nombre de la tabla de origen no se demuestra en el SAS; se declara', campos: {tipo: 'Tabla Impala', ubicacion: 'impala_dsn', uso: 'Entrada de job_producto', estado: 'pendiente (nombre de tabla)'}}
      - {id: F07, clave: 'Depósitos ahorros (origen AHO)', clasificacion: declarada, motivo: 'El nombre de la tabla de origen no se demuestra en el SAS; se declara', campos: {tipo: 'Tabla Impala', ubicacion: 'impala_dsn', uso: 'Entrada de job_producto', estado: 'pendiente (nombre de tabla)'}}
      - {id: F08, clave: 'Depósitos Nequi (origen NEQUI)', clasificacion: declarada, motivo: 'El nombre de la tabla de origen no se demuestra en el SAS; se declara', campos: {tipo: 'Tabla Impala', ubicacion: 'impala_dsn', uso: 'Entrada de job_producto', estado: 'pendiente (nombre de tabla)'}}

