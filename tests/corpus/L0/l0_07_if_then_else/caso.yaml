razonamiento: |
  LENGTH nivel $ 5 fija el largo en 5, porque MEDIO tiene 5 letras y el primer valor asignado
  (ALTO) tiene 4. Sin LENGTH, SAS tomaria 4 y MEDIO quedaria como MEDI.
  Reglas: saldo >= 2000 ALTO; saldo >= 500 MEDIO; si no, BAJO.
  101 1542 MEDIO.  102 356 BAJO.  103 2478 ALTO.  104 344 BAJO.  105 141 BAJO.
  106 1278 MEDIO.  107 1880 MEDIO (menor que 2000).  108 1374 MEDIO.  109 913 MEDIO.
revisor: segundo_agente
