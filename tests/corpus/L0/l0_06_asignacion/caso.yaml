nivel: L0
construcciones: [PROC IMPORT, DATA, SET, ASIGNACION, ARITMETICA, PROC EXPORT]
capa: C
tolerancia: 0
orden_relevante: true
estado: revisado
motivo: "Esperado escrito a mano y recalculado por un segundo agente sin verlo: coincide."
salidas: [inventario]
razonamiento: |
  total_valor = precio * stock, por fila (enteros, sin faltantes):
  PRD-001 124*68 = 8432.   PRD-002 277*1 = 277.   PRD-003 156*15 = 2340.
  PRD-004 150*42 = 6300.   PRD-005 79*4 = 316.    PRD-006 206*27 = 5562.
  PRD-007 18*65 = 1170.
  total_valor es la ultima columna; las demas no cambian.
revisor: segundo_agente
esquemas:
  WORK.productos:
    precio: {tipo: pendiente, motivo: "PROC IMPORT CSV con GETNAMES y sin LENGTH ni GUESSINGROWS; el tipo lo fija el dato"}
    stock: {tipo: pendiente, motivo: "PROC IMPORT CSV con GETNAMES y sin LENGTH ni GUESSINGROWS; el tipo lo fija el dato"}
  WORK.inventario:
    precio: {tipo: pendiente, motivo: "salida de DATA step sin LENGTH; hereda de WORK.productos"}
    stock: {tipo: pendiente, motivo: "salida de DATA step sin LENGTH; hereda de WORK.productos"}
    total_valor: {tipo: pendiente, motivo: "asignacion en DATA step sin LENGTH ni tipo declarado en el programa"}
