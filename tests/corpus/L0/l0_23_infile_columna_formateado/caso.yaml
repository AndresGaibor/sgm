  - INPUT formateado
  - informats $w., w. y w.d
capa: C
estado: traducible
motivo: >-
  La lectura por columnas está calculada en el anillo B con informats simples documentados. La
  plantilla de tFileInputPositional y su validación en Studio siguen pendientes.
salidas: [mov]
tolerancia: 0
orden_relevante: true
razonamiento: >-
  lestmtsref.pdf, p. 195 y 199 define las posiciones, anchos e informats del INPUT; p. 137 explica
