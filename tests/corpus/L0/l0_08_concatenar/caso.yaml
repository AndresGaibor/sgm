nivel: L0
construcciones: [PROC IMPORT, DATA, SET, LENGTH, '||', TRIM, KEEP, PROC EXPORT]
capa: C
tolerancia: 0
orden_relevante: true
estado: revisado
motivo: "Esperado escrito a mano y recalculado por un segundo agente sin verlo: coincide."
salidas: [etiquetas]
razonamiento: |
  etiqueta = TRIM(nombre) || ' (' || TRIM(ciudad) || ')'. TRIM quita los blancos finales del
  campo de longitud fija; LENGTH 60 evita el corte. KEEP deja id_cliente y etiqueta.
  101 "Jorge Caso (Villa Norte)"; 102 "Felipe Dato (Valle Alto)"; 103 "Bruno Demo (Puerto Sur)";
  104 "Irene Modelo (Lago Azul)"; 105 "Irene Modelo (Villa Norte)"; 106 "Carla Muestra (Monte Verde)".
  No hay comas en el texto, asi que el CSV no lleva comillas.
revisor: segundo_agente
esquemas:
  WORK.clientes:
    id_cliente: {tipo: pendiente, motivo: "PROC IMPORT CSV con GETNAMES y sin LENGTH ni GUESSINGROWS; el tipo lo fija el dato"}
    nombre: {tipo: pendiente, motivo: "PROC IMPORT CSV con GETNAMES y sin LENGTH ni GUESSINGROWS; el tipo lo fija el dato"}
    ciudad: {tipo: pendiente, motivo: "PROC IMPORT CSV con GETNAMES y sin LENGTH ni GUESSINGROWS; el tipo lo fija el dato"}
  WORK.etiquetas:
    id_cliente: {tipo: pendiente, motivo: "salida de DATA step sin LENGTH; hereda de WORK.clientes"}
    etiqueta: {tipo: String, longitud: 60, linea: 12}
