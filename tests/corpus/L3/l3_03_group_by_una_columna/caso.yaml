nivel: L3
construcciones: [PROC SQL, GROUP BY, COUNT, SUM, ORDER BY, FALTANTES, CREATE TABLE AS]
capa: A
tolerancia: 0
orden_relevante: true
estado: traducible
salidas: [por_ciudad]
invariantes:
  - "suma(por_ciudad.clientes) == filas(clientes)"
  - "suma(por_ciudad.saldo_total) == suma(clientes.saldo)"
esquemas:
  WORK.CLIENTES:
    id_cliente:
      tipo: Double
      linea: 5
      fuente: muestra
    nombre:
      tipo: String
      linea: 5
      fuente: muestra
    ciudad:
      tipo: String
      linea: 5
      fuente: muestra
    saldo:
      tipo: Double
      linea: 5
      fuente: muestra
    estado:
      tipo: String
      linea: 5
      fuente: muestra
  WORK.POR_CIUDAD:
    clientes:
      tipo: pendiente
      motivo: sin tipo demostrado en el programa ni en la muestra de entradas
    saldo_total:
      tipo: pendiente
      motivo: sin tipo demostrado en el programa ni en la muestra de entradas
