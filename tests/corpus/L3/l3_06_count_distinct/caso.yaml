nivel: L3
construcciones: [PROC SQL, COUNT, COUNT(DISTINCT), CREATE TABLE AS]
capa: A
tolerancia: 0
orden_relevante: false
estado: traducible
salidas: [resumen_ventas]
invariantes:
  - "valor(resumen_ventas.ventas) == filas(ventas)"
  - "valor(resumen_ventas.clientes_distintos) <= valor(resumen_ventas.ventas)"
  - "valor(resumen_ventas.clientes_distintos) <= filas(clientes)"
  - "valor(resumen_ventas.canales) <= 3"
esquemas:
  WORK.VENTAS:
    id_venta:
      tipo: Double
      linea: 6
      fuente: muestra
    id_cliente:
      tipo: Double
      linea: 6
      fuente: muestra
    fecha:
      tipo: String
      linea: 6
      fuente: muestra
    monto:
      tipo: Double
      linea: 6
      fuente: muestra
    canal:
      tipo: String
      linea: 6
      fuente: muestra
    cantidad:
      tipo: Double
      linea: 6
      fuente: muestra
  WORK.CLIENTES:
    id_cliente:
      tipo: Double
      linea: 10
      fuente: muestra
    nombre:
      tipo: String
      linea: 10
      fuente: muestra
    ciudad:
      tipo: String
      linea: 10
      fuente: muestra
    saldo:
      tipo: Double
      linea: 10
      fuente: muestra
    estado:
      tipo: String
      linea: 10
      fuente: muestra
  WORK.RESUMEN_VENTAS:
    ventas:
      tipo: pendiente
      motivo: sin tipo demostrado en el programa ni en la muestra de entradas
    clientes_distintos:
      tipo: pendiente
      motivo: sin tipo demostrado en el programa ni en la muestra de entradas
    canales:
      tipo: pendiente
      motivo: sin tipo demostrado en el programa ni en la muestra de entradas
