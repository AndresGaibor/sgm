nivel: L3
construcciones: [PROC SQL, GROUP BY, HAVING, COUNT, CREATE TABLE AS]
capa: A
tolerancia: 0
orden_relevante: false
estado: traducible
salidas: [todos_grupos, grupos_grandes, grupos_pequenos]
invariantes:
  - "suma(todos_grupos.n) == filas(clientes)"
  - "suma(grupos_grandes.n) + suma(grupos_pequenos.n) == filas(clientes)"
  - "filas(grupos_grandes) <= filas(todos_grupos)"
esquemas:
  WORK.CLIENTES:
    id_cliente:
      tipo: Double
      linea: 7
      fuente: muestra
    nombre:
      tipo: String
      linea: 7
      fuente: muestra
    ciudad:
      tipo: String
      linea: 7
      fuente: muestra
    saldo:
      tipo: Double
      linea: 7
      fuente: muestra
    estado:
      tipo: String
      linea: 7
      fuente: muestra
  WORK.TODOS_GRUPOS:
    n:
      tipo: pendiente
      motivo: sin tipo demostrado en el programa ni en la muestra de entradas
  WORK.GRUPOS_GRANDES:
    n:
      tipo: pendiente
      motivo: sin tipo demostrado en el programa ni en la muestra de entradas
  WORK.GRUPOS_PEQUENOS:
    n:
      tipo: pendiente
      motivo: sin tipo demostrado en el programa ni en la muestra de entradas
