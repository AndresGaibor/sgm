nivel: L3
construcciones: [PROC SQL, GROUP BY VARIAS COLUMNAS, COUNT, AVG, FALTANTES, ORDER BY, CREATE TABLE AS]
capa: A
tolerancia: 0.001
orden_relevante: true
estado: traducible
salidas: [por_ciudad_estado]
invariantes:
  - "suma(por_ciudad_estado.clientes) == filas(clientes)"
  - "filas(por_ciudad_estado) <= filas(clientes)"
esquemas:
  WORK.CLIENTES:
    id_cliente:
      tipo: Double
      linea: 5
      fuente: muestra
    nombre:
      tipo: String
      linea: 5
      fuente: muestra
    ciudad:
      tipo: String
      linea: 5
      fuente: muestra
    saldo:
      tipo: Double
      linea: 5
      fuente: muestra
    estado:
      tipo: String
      linea: 5
      fuente: muestra
  WORK.POR_CIUDAD_ESTADO:
    clientes:
      tipo: pendiente
      motivo: sin tipo demostrado en el programa ni en la muestra de entradas
    saldo_promedio:
      tipo: pendiente
      motivo: sin tipo demostrado en el programa ni en la muestra de entradas
