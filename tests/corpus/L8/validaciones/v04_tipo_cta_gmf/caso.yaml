dudas:
  - La regla de que un faltante es menor que cualquier numero (NOT BETWEEN lo marca) viene de la documentacion de IS NULL e IS MISSING; el caso depende de ella para separar GMF no numerico de GMF fuera de rango.
  - Las listas 1 a 5 (tipo de cuenta) y 1 a 10 (GMF) son reglas ficticias de ejemplo.
  - No se confirmo que NOT IN con literales de texto se evalue igual que en SQLite; se usa como oraculo de capa A.
