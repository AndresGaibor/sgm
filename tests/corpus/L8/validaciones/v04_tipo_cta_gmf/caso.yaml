- filas(SABANA_AHO) == filas(SABANA_VALIDA_AHO) + filas(INCONS_CUENTA_AHO)
- suma(CONTEO_CUENTA.NRO_RECHAZOS) == filas(INCONS_CUENTA_CTE) + filas(INCONS_CUENTA_AHO)
