nivel: L8
tema: tipo de cuenta invalido (lista de valores) y GMF invalido (rango), con missing
construcciones:
- data step con input(left(...), 3.) para GMF (texto no numerico queda faltante)
- PROC SQL WHERE TIPO_CTA NOT IN ('1','2','3','4','5') y su complemento IN
- PROC SQL WHERE GMF IS MISSING OR GMF NOT BETWEEN 1 AND 10
- PROC SQL CASE WHEN ... IS MISSING THEN ... ELSE ... END AS MOTIVO
- PROC SQL LEFT JOIN ... WHERE ... IS MISSING para excluir rechazos
- PROC SQL DISTINCT
- PROC SQL OUTER UNION CORR con literal como columna
- PROC EXPORT DBMS=DLM PUTNAMES=NO
