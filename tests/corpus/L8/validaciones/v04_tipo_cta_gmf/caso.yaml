  cruce con el oráculo SQL está en validaciones_cruce.'
estado: pendiente_revision
motivo: Cruce completo (16 tablas y archivos) sin diferencias. Falta confirmar el formato 3. de GMF en
  PROC EXPORT.
orden_relevante: false
observacion_revision: 'Sin SAS en el entorno. PROC IMPORT tipa las columnas con la convención del corpus
  (DIFERENCIAS.md, tipo de columna); PROC EXPORT se supone sin comillas, con faltante vacío y sin formato.
  Ninguna de esas dos cosas está demostrada con SAS. GMF_TXT tiene XX: PROC IMPORT tipa texto toda la
  columna y el input convierte; el XX queda faltante. En PROC EXPORT, GMF 99 se escribe sin relleno (formato
  3. de SAS). SABANA_VALIDA sale de SELECT DISTINCT: el orden no está garantizado.'
