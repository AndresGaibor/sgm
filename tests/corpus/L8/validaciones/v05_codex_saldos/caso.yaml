dudas:
  - Que input(left('-12001'), 20.) lea un negativo no se confirmo con un ejemplo de la documentacion; el caso lo supone.
  - La suma SUM(FIN_SALDO_CTA) sobre datos sin faltantes es evidente, pero el tratamiento de faltantes no entra en este caso.
  - Los codigos de codex (relacion 1000, GMF fuera de 1 a 10) son ficticios.
