razonamiento: 'Capa declarada originalmente: A (SQL, NOT IN, SUM) y B (input de texto con signo). El esperado
  sale de la verdad plantada (validaciones_esperado); el cruce con el oráculo SQL está en validaciones_cruce.'
estado: pendiente_revision
motivo: Cruce completo (19 tablas y archivos) sin diferencias. Falta confirmar que input() lee el negativo
  y el formato 20. y 3. de PROC EXPORT.
orden_relevante: false
observacion_revision: 'Sin SAS en el entorno. PROC IMPORT tipa las columnas con la convención del corpus
  (DIFERENCIAS.md, tipo de columna); PROC EXPORT se supone sin comillas, con faltante vacío y sin formato.
  Ninguna de esas dos cosas está demostrada con SAS. FIN_SALDO_TXT y GMF se tipan numéricos; el negativo
  se lee con signo (input(left(''-12001''), 20.)). Duda: formatos 20. y 3. en PROC EXPORT, que el esperado
  no rellena.'
invariantes:
- filas(SABANA_CTE) == filas(SABANA_VALIDA_CTE) + filas(RECHAZO_CODEX_CTE) + filas(RECHAZO_SALDO_CTE)
- filas(SABANA_AHO) == filas(SABANA_VALIDA_AHO) + filas(RECHAZO_CODEX_AHO) + filas(RECHAZO_SALDO_AHO)
- suma(CONTEO_CODEX_SALDO.NRO_RECHAZOS) == filas(RECHAZO_CODEX_CTE) + filas(RECHAZO_SALDO_CTE) + filas(RECHAZO_CODEX_AHO)
  + filas(RECHAZO_SALDO_AHO)
