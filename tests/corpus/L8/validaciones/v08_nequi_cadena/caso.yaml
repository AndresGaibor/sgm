dudas:
  - La sabana final esperada tiene 72 filas (70 validas mas 2 con tipo de cuenta 9 que este paso no valida): es la trampa del caso.
  - Que la region Nequi del original no tenga etapa de tipo de cuenta se verifico por etiquetas entre las lineas 7380 y 16400 de client_large.sas; no se verifico que no exista en otra parte del original.
  - El paso SABANA_FINAL usa un LEFT JOIN sobre tipo de documento invalido que nunca casa, por diseno del caso (como en el original). No cambia el conteo.
  - Los codigos TD01 a TD05 son ficticios.
