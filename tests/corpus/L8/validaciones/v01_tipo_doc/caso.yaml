nivel: L8
tema: tipo de documento invalido contra homologacion (CTE y AHO)
construcciones:
  - PROC IMPORT DBMS=EXCELCS (homologacion)
  - PROC DOWNLOAD dentro de RSUBMIT y PROC IMPORT DBMS=DLM GETNAMES=NO
  - macro con parametro de producto (%macro valida_tipo_doc(sufijo))
  - PROC SQL LEFT JOIN ... WHERE IS MISSING (rechazo)
  - PROC SQL INNER JOIN (valido)
  - PROC SQL OUTER UNION CORR con conteos
  - PROC EXPORT DBMS=DLM PUTNAMES=NO
capa: A (PROC SQL sobre SQLite) para los joins y conteos
estado: sin_esperado
entradas:
  - DETALLE_CTE.csv (23 columnas, sin cabecera, separado por ;)
  - DETALLE_AHO.csv (23 columnas)
  - Homologacion_tpo_dto.xlsx (columna CNAME: TD01 a TD04)
anomalias_plantadas:
  cte:
    tipo_doc_invalido: 7
    validos: 88
  aho:
    tipo_doc_invalido: 5
    validos: 60
salidas_esperadas:
  tablas_work:
    - SABANA_CTE
    - SABANA_AHO
    - TIPO_DOC_INVALIDO_CTE
    - TIPO_DOC_INVALIDO_AHO
    - TIPO_DOC_VALIDO_CTE
    - TIPO_DOC_VALIDO_AHO
    - RECHAZO_TIPO_DOC_CTE
    - RECHAZO_TIPO_DOC_AHO
    - CONTEO_RECHAZO_TIPO_DOC
    - CONTEO_VALIDO_TIPO_DOC
  archivos:
    - RECHAZO_TIPO_DOC_CTE.csv
    - RECHAZO_TIPO_DOC_AHO.csv
