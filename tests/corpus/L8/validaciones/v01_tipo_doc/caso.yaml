capa: A
razonamiento: 'Capa declarada originalmente: A (PROC SQL sobre SQLite) para los joins y conteos. El esperado
  sale de la verdad plantada (validaciones_esperado); el cruce con el oráculo SQL está en validaciones_cruce.'
estado: pendiente_revision
motivo: Cruce completo (12 tablas y archivos) sin diferencias. Falta confirmar el tipo de NRO_DOC en PROC
  IMPORT y el formato de PROC EXPORT.
orden_relevante: false
observacion_revision: Sin SAS en el entorno. PROC IMPORT tipa las columnas con la convención del corpus
  (DIFERENCIAS.md, tipo de columna); PROC EXPORT se supone sin comillas, con faltante vacío y sin formato.
  Ninguna de esas dos cosas está demostrada con SAS. NRO_DOC (VAR10) queda texto, con sus ceros (00000001),
  por la convención del corpus. Si PROC IMPORT lo toma numérico, PROC EXPORT escribe 1 en RECHAZO_TIPO_DOC
  y pierde los ceros.
invariantes:
- filas(SABANA_CTE) == filas(TIPO_DOC_INVALIDO_CTE) + filas(TIPO_DOC_VALIDO_CTE)
- filas(SABANA_AHO) == filas(TIPO_DOC_INVALIDO_AHO) + filas(TIPO_DOC_VALIDO_AHO)
- filas(RECHAZO_TIPO_DOC_CTE) == filas(TIPO_DOC_INVALIDO_CTE)
- suma(CONTEO_RECHAZO_TIPO_DOC.NRO_RECHAZOS) == filas(RECHAZO_TIPO_DOC_CTE) + filas(RECHAZO_TIPO_DOC_AHO)
