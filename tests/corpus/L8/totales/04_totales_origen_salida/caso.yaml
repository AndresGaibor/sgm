id: 04_totales_origen_salida
nivel: L8
tema: totales de origen y de salida por producto
construcciones:
- COUNT(*) y SUM(...) en PROC SQL
- input(left(...), 20.)
- SUM ignora faltantes
- WHERE TIPO_CTA <> '03'
productos:
- CTE
- AHO
capa: A
estado: traducible
anomalias_plantadas:
  cte_filas_origen: 40
  cte_saldos_no_vacios_origen: 38
  cte_suma_saldo_origen: '170632.98'
  cte_filas_salida: 39
  cte_suma_saldo_salida: '163686.34'
  aho_filas_origen: 40
  aho_filas_salida: 37
  aho_suma_saldo_origen: '211498.67'
  aho_suma_saldo_salida: '198645.97'
supuestos:
- la salida excluye TIPO_CTA 03; regla de este caso, no del SAS
fuentes_url:
- https://support.sas.com/documentation/cdl/en/proc/65145/HTML/default/p1holnuvm8kon1n1wwhvrjnrab65.htm
- https://support.sas.com/documentation/cdl/en/proc/65145/HTML/default/n0ku4pxzx3d2len10ozjgyjbrpl9.htm
- https://support.sas.com/documentation/cdl/en/acpcref/63181/HTML/default/n06lm371ac8dj6n17xrbr5fofcgb.htm
- https://go.documentation.sas.com/api/docsets/acreldb/9.4/content/n0l3rcy5ljom1ln1o34eq22rzedg.htm
razonamiento: Todo el programa es PROC SQL sobre ORIGEN_CTE y ORIGEN_AHO; la conversión input(left())
  se hace antes, como DATA step, en Python.
tolerancia: 0.005
orden_relevante: false
invariantes:
- valor(TOTAL_ORIGEN_CTE.NRO_FILAS_ORIGEN) == valor(TOTAL_SALIDA_CTE.NRO_FILAS_SALIDA) + 1
- valor(TOTAL_ORIGEN_AHO.NRO_FILAS_ORIGEN) == valor(TOTAL_SALIDA_AHO.NRO_FILAS_SALIDA) + 3
- valor(TOTAL_ORIGEN_CTE.NRO_FILAS_ORIGEN) - valor(TOTAL_ORIGEN_CTE.NRO_SALDOS_NO_VACIOS) == 2
- valor(RESUMEN_TOTALES.FILAS_SALIDA_AHO) == valor(TOTAL_SALIDA_AHO.NRO_FILAS_SALIDA)
salidas:
- TOTAL_ORIGEN_CTE
- TOTAL_SALIDA_CTE
- TOTAL_ORIGEN_AHO
- TOTAL_SALIDA_AHO
- RESUMEN_TOTALES
salidas_esperadas:
