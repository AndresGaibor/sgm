id: 08_cadena_completa_macros
nivel: L8
tema: cadena completa de duplicados a conciliación con macros
construcciones:
- '%macro con parámetros por producto'
- PROC SORT NODUPREC
- CASE / sustitución
- OUTER UNION CORR
- PROC EXPORT por producto
- macrovariable de fecha
productos:
- CTE
- AHO
capa: C
estado: pendiente_revision
anomalias_plantadas:
  fecha_concatenada: '20260930'
  cte_filas_origen: 32
  cte_duplicados_extra: 2
  cte_filas_tras_dedup: 30
  cte_corregidas: 1
  cte_por_corregir: 1
  cte_filas_sabana: 29
  cte_suma_saldo_sabana: '128734.00'
  cte_dif_sin_duplicados_exactos: 1
  cte_estado: CONCILIA
  cte_archivo_salida: CIERRE_CTE_20260930.csv
  aho_filas_origen: 32
  aho_duplicados_extra: 2
  aho_filas_tras_dedup: 30
  aho_corregidas: 1
  aho_por_corregir: 1
  aho_filas_sabana: 29
  aho_suma_saldo_sabana: '122531.60'
  aho_dif_sin_duplicados_exactos: 1
  aho_estado: CONCILIA
  aho_archivo_salida: CIERRE_AHO_20260930.csv
supuestos:
- la cadena deduplica antes de corregir, como en el original
fuentes_url:
- https://support.sas.com/documentation/cdl/en/proc/65145/HTML/default/p1holnuvm8kon1n1wwhvrjnrab65.htm
- https://support.sas.com/documentation/cdl/en/proc/65145/HTML/default/n0ku4pxzx3d2len10ozjgyjbrpl9.htm
- https://support.sas.com/documentation/cdl/en/acpcref/63181/HTML/default/n06lm371ac8dj6n17xrbr5fofcgb.htm
- https://go.documentation.sas.com/api/docsets/acreldb/9.4/content/n0l3rcy5ljom1ln1o34eq22rzedg.htm
motivo: Cadena con macro por producto, NODUPREC, PROC EXPORT y una fórmula de conciliación que no hace
  lo que dice su nombre (ver observacion_revision).
razonamiento: 'Por producto: dedupe por construcción (NODUPREC), marca, sábana y totales; los SQL se cruzaron
  con SQLite con las macros resueltas y coinciden en todas las salidas.'
observacion_revision: 'El cruce con el oráculo SQL coincide: el vacío de una columna de texto se guarda
  como '''', así que INCONSISTENCIA = '''' sí marca las filas y SABANA, TOTALES, CONCILIACION y RESUMEN
  no se quedan en cero (convención de faltantes del hito 77c). Hallazgo del programa, no del oráculo:
  DIF_SIN_DUPLICADOS_EXACTOS resta NRO_POR_CORREGIR de NRO_ORIGEN - NRO_UNICOS; el nombre sugiere los
  duplicados exactos (2 por producto), pero la fórmula da 1, y el esperado sigue la fórmula escrita. Además,
  el estado usa solo DIF_TOTAL (no las filas), a diferencia de 05. Sin demostrar: qué fila conserva NODUPREC
  y el formato del PROC EXPORT.'
tolerancia: 0.005
orden_relevante: false
invariantes:
- valor(TOTALES_CTE.NRO_ORIGEN) == valor(TOTALES_CTE.NRO_UNICOS) + 2
- valor(TOTALES_CTE.NRO_SABANA) + valor(TOTALES_CTE.NRO_POR_CORREGIR) == valor(TOTALES_CTE.NRO_UNICOS)
- suma(SABANA_CTE.FORM_FIN_SALDO_CTA) == valor(TOTALES_CTE.SUMA_SABANA)
- valor(RESUMEN_CADENA.NRO_SABANA) == valor(TOTALES_CTE.NRO_SABANA)
salidas:
- ORIGEN_CTE
- SABANA_CTE
- TOTALES_CTE
- CONCILIACION_CTE
- INCONS_DEP_CTE
- CORREGIDAS_CTE
- ORIGEN_AHO
- SABANA_AHO
- TOTALES_AHO
- CONCILIACION_AHO
- INCONS_DEP_AHO
- CORREGIDAS_AHO
- RESUMEN_CADENA
salidas_esperadas:
