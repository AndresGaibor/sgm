id: 01_duplicados_frecuencias
nivel: L8
tema: duplicados y frecuencias
construcciones:
- PROC SORT NODUPKEY
- PROC SORT NODUPREC
- PROC SQL GROUP BY HAVING COUNT(*)
- CASE WHEN en PROC SQL
- SUM sobre tabla de frecuencias
productos:
- AHO
capa: C
estado: parcial
anomalias_plantadas:
  filas_origen: 47
  grupos_duplicados_exactos: 4
  filas_extra_duplicados_exactos: 5
  grupos_duplicados_por_llave: 6
  filas_extra_por_llave: 7
  llaves_unicas: 40
  extra_segun_case_original: 1
  suma_saldo_origen: '220987.38'
supuestos:
- el NODUPKEY conserva la primera fila de cada llave (EQUALS por defecto)
fuentes_url:
- https://support.sas.com/documentation/cdl/en/proc/65145/HTML/default/p1holnuvm8kon1n1wwhvrjnrab65.htm
- https://support.sas.com/documentation/cdl/en/proc/65145/HTML/default/n0ku4pxzx3d2len10ozjgyjbrpl9.htm
- https://support.sas.com/documentation/cdl/en/acpcref/63181/HTML/default/n06lm371ac8dj6n17xrbr5fofcgb.htm
- https://go.documentation.sas.com/api/docsets/acreldb/9.4/content/n0l3rcy5ljom1ln1o34eq22rzedg.htm
motivo: PROC SORT NODUPKEY y NODUPREC no los ejecuta el oráculo SQL; sus tablas se calculan por construcción
  (razonamiento).
razonamiento: Las frecuencias, el filtro, la revisión de llaves y los conteos de control son PROC SQL
  y se cruzaron con SQLite. NODUPKEY conserva la primera fila de cada llave en orden de entrada; NODUPREC
  conserva una fila por combinación idéntica de las 24 variables.
tolerancia: 0.005
orden_relevante: false
invariantes:
- valor(CONTROL_DUPLICADOS_AHO.NRO_REGISTROS_ORIGEN) == filas(AHO_SIN_DUPLICADOS_EXACTOS) + 5
- valor(CONTROL_DUPLICADOS_AHO.NRO_LLAVES_UNICAS) == filas(AHO_UNICOS)
- valor(CONTROL_DUPLICADOS_AHO.NRO_REGISTROS_DUPLICADOS) == 1
salidas:
- FRECUENCIA_REGISTROS_AHO
- FILTRO_DUPLICADOS_AHO
- CONCILIACION_DUPLICADOS_AHO
- AHO_UNICOS
- AHO_SIN_DUPLICADOS_EXACTOS
- REVISION_LLAVES_AHO
- CONTROL_DUPLICADOS_AHO
- SUMA_SALDO_ORIGEN_AHO
