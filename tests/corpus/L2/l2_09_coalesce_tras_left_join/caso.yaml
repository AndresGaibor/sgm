nivel: L2
construcciones: [PROC SQL, COALESCE, LEFT JOIN, "ON", CREATE TABLE AS]
capa: A
tolerancia: 0
orden_relevante: false
estado: traducible
salidas: [clientes_monto]
invariantes:
  - "suma(clientes_monto.monto) == suma(ventas.monto)"
esquemas:
  WORK.CLIENTES:
    id_cliente: {tipo: pendiente, motivo: "PROC IMPORT CSV con GETNAMES y sin LENGTH ni GUESSINGROWS; el tipo lo fija el dato"}
    nombre: {tipo: pendiente, motivo: "PROC IMPORT CSV con GETNAMES y sin LENGTH ni GUESSINGROWS; el tipo lo fija el dato"}
  WORK.VENTAS:
    canal: {tipo: pendiente, motivo: "PROC IMPORT CSV con GETNAMES y sin LENGTH ni GUESSINGROWS; el tipo lo fija el dato"}
    monto: {tipo: pendiente, motivo: "PROC IMPORT CSV con GETNAMES y sin LENGTH ni GUESSINGROWS; el tipo lo fija el dato"}
    id_cliente: {tipo: pendiente, motivo: "PROC IMPORT CSV con GETNAMES y sin LENGTH ni GUESSINGROWS; el tipo lo fija el dato"}
  WORK.clientes_monto:
    id_cliente: {tipo: pendiente, motivo: "salida de SELECT sin tipo declarado; hereda de WORK.CLIENTES"}
    nombre: {tipo: pendiente, motivo: "salida de SELECT sin tipo declarado; hereda de WORK.CLIENTES"}
    canal: {tipo: pendiente, motivo: "salida de SELECT sin tipo declarado; expresion COALESCE sobre WORK.VENTAS"}
    monto: {tipo: pendiente, motivo: "salida de SELECT sin tipo declarado; expresion COALESCE sobre WORK.VENTAS"}
