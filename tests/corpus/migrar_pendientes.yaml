# Casos de `L0` a `L6` que `sgm migrar` todavía no traduce por completo.
#
# Una entrada es un caso con al menos un pendiente de traducción, y el motivo es el primero que sale
# en `pendientes.md` —el de la línea más temprana del SAS—. La lista es viva en los dos sentidos:
# `test_solo_los_casos_listados_tienen_pendientes` exige que ningún caso de fuera tenga pendientes, y
# `test_la_lista_no_tiene_casos_resueltos` falla cuando un caso de aquí ya no tiene ninguno, para
# obligar a quitar su entrada.
#
# Los pendientes de tipo (`P-TIPO-DESCONOCIDO`) **no cuentan**: sin catálogo del entorno no hay tipo
# que demostrar, el Job se ejecuta igual con `String`, y una lista que los incluyera tendría los 101
# casos para siempre y no diría nada. Lo que cuenta es lo que no se tradujo.
#
# Cada caso se migra con su carpeta `entradas/` como muestra (`sgm migrar --muestra`), que es como se
# usa la herramienta: la cabecera de la CSV da las columnas, y sin ella un `WHERE` sobre una columna
# sin calificar tras un `JOIN` no se puede atribuir a ninguna tabla.

