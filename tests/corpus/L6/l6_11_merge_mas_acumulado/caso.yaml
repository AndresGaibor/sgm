salidas:
- VENTAS_ZONA
razonamiento: 'MERGE por ZONA: una observación de cada entrada por iteración dentro del grupo (lrcon, p. 598), así que ZONAS aporta NOMBRE a sus dos filas. ACUM+MONTO es la sentencia suma: el valor se retiene de una iteración a la siguiente y un faltante cuenta como cero (lestmtsref, p. 360). IF FIRST.ZONA THEN ACUM=0 reinicia el acumulado en cada grupo (lrcon, p. 598). El intérprete reproduce el esperado (10, 25, 7; suma 42).'
