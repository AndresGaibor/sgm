# Arquitectura de Jobs de Talend para client_large.sas (sección 3 del diseño). Es una decisión del
# equipo, no un hecho del SAS: el SAS no dice cuántos Jobs hay ni cómo se llaman. Los productos salen
# de `client_large.agrupacion.yaml`; aquí solo se nombra la estructura.
programa: client_large.sas
proyecto: PRJ_BANCOLOMBIA
entornos: [DEV, QA, PROD]   # el Job padre falla si `env_nombre` no es uno de ellos (diseño 2.4)
jobs:
  padre: job_exogena_depositos
  producto: job_producto      # un solo Job con el producto como parámetro (D6)
  totales: job_totales
  conciliacion: job_conciliacion
mensaje_fin: Proceso terminado

# La fecha del proceso (tabla 1.1 del diseño): el padre lee su Excel una vez y deja AÑO, MES y DIA en
# variables de contexto; los hijos las heredan porque el padre transmite el contexto completo.
periodo:
  fuente: 'Validación de fecha'
  variables: {AÑO: periodo_anio, MES: periodo_mes, DIA: periodo_dia}

# Excel que job_producto usa como lookup en su tMap. Hoy solo se listan: la validación de producto
# todavía no se traduce.
lookups_producto:
  - 'Homologación de tipo de documento'
  - 'Homologación de tipo de documento Nequi'
  - 'Códigos de país'
  - 'Códigos DANE'

# Archivo final de totales (R2-02): job_totales escribe <archivo>_<anio><mes><dia>.csv.
archivo_totales: totales_exogena

# Totales de origen de job_producto: el SAS cuenta los registros y suma esta columna (convertida con
# input(left(col), 20.)) antes de validar; son la base de la conciliación.
total_origen:
  columna_saldo: FIN_SALDO_CTA

# Validaciones de fila por lookup (sección 3.3). El SAS demuestra el patrón para el tipo de documento:
# LEFT JOIN al Excel de homologación con `WHERE CNAME IS MISSING` (rechazo) e INNER JOIN (válidos).
# El motivo es el texto que llevará la columna `motivo` del archivo de rechazos.
validaciones_producto:
  - nombre: tipo_documento
    columna: TIPO_DOC
    columna_lookup: CNAME
    motivo: TIPO_DOC_INVALIDO
    fuente: 'Homologación de tipo de documento'
    excepciones: {NEQUI: 'Homologación de tipo de documento Nequi'}
