[project]
name = "sgm"
version = "0.2.0"
description = "Compilador de programas SAS a una guía de migración a Talend Studio 8.0.1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.3",
    "typer>=0.12",
    "pyyaml>=6.0",
    "sqlglot>=30.27.0",
    "jsonschema>=4.26.0",
]

[project.scripts]
sgm = "sgm.cli:app"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-testmon>=2.3.0",
    "pytest-xdist>=3.5",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

# Decisión: E501 se tolera solo en código con mensajes de usuario en español y patrones largos (portados
# o de datos). El resto del código respeta line-length = 100. Ver PROGRESS.md, "Decisiones".
[tool.ruff.lint.per-file-ignores]
"src/sgm/catalog/environment.py" = ["E501"]
"src/sgm/emit/conventions/*.py" = ["E501"]
"src/sgm/expressions/*.py" = ["E501"]
"src/sgm/ingest/importer.py" = ["E501"]
"src/sgm/redaction.py" = ["E501"]
"src/sgm/passes/plumbing_patterns.py" = ["E501"]
"src/sgm/frontend/*.py" = ["E501"]
"tests/**/*.py" = ["E501"]
