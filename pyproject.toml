[project]
name = "sgm"
version = "0.2.0"
description = "Compilador de programas SAS a una guía de migración a Talend Studio 8.0.1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.3",
    "typer>=0.12",
    "pyyaml>=6.0",
    # Fuera de la lista permitida de AGENTS.md; aprobada en el hito 80 (R0-04, DC-11). Analiza y
    # reescribe el SQL de SAS: `sgm/ir/sql_tree.py`, `sql_portability.py`, `sql_render.py` y
    # `passes/db_*.py`. Un analizador propio no cambiaría la salida, solo el riesgo.
    "sqlglot>=30.27.0",
    # Igual: valida el YAML de reglas contra su esquema en `sgm/rules_validate.py`.
    "jsonschema>=4.26.0",
]

[project.scripts]
sgm = "sgm.cli:app"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Fuera de la lista permitida; aprobada en el hito 80 (R0-04). Solo acelera los ciclos locales
    # (`pytest --testmon`); el cierre de cada hito corre la suite completa sin él.
    "pytest-testmon>=2.3.0",
    "pytest-xdist>=3.5",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `studio` son las pruebas que necesitan Talend Studio libre: no corren por omisión (ver
# `tools/ciclo_rapido.py` y `tests/studio/`). Se piden con `-m studio`.
addopts = "-n auto -m 'not studio'"
markers = ["studio: necesita Talend Studio; no corre por omisión"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

# Decisión: E501 se tolera solo en código con mensajes de usuario en español y patrones largos (portados
# o de datos). El resto del código respeta line-length = 100. Ver PROGRESS.md, "Decisiones".
[tool.ruff.lint.per-file-ignores]
"src/sgm/catalog/environment.py" = ["E501"]
"src/sgm/emit/conventions/*.py" = ["E501"]
"src/sgm/expressions/*.py" = ["E501"]
"src/sgm/ingest/importer.py" = ["E501"]
"src/sgm/redaction.py" = ["E501"]
"src/sgm/passes/plumbing_patterns.py" = ["E501"]
"src/sgm/frontend/*.py" = ["E501"]
"tests/**/*.py" = ["E501"]
